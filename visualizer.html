<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MedQA Multi-Agent Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f8fafc;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 60px;
    min-height: 100vh;
    color: #1e293b;
    background-image:
      radial-gradient(circle at 1px 1px, #e2e8f0 1px, transparent 0);
    background-size: 28px 28px;
  }

  .header {
    text-align: center;
    margin-bottom: 44px;
  }

  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #eff6ff, #f0fdf4);
    border: 1px solid #bfdbfe;
    border-radius: 999px;
    padding: 4px 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #2563eb;
    margin-bottom: 14px;
  }

  .title {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #0f172a;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 1rem;
    color: #64748b;
    font-weight: 400;
  }

  .diagram-card {
    background: #ffffff;
    border-radius: 24px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 20px 60px -10px rgba(0,0,0,0.08);
    padding: 32px;
    width: 1140px;
    max-width: 100%;
  }

  svg { width: 100%; height: auto; overflow: visible; }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 28px;
    justify-content: center;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: #475569;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }

  /* ANIMATED PACKETS */
  @keyframes travel {
    0%   { opacity: 0; offset-distance: 0%; }
    6%   { opacity: 1; }
    94%  { opacity: 1; }
    100% { opacity: 0; offset-distance: 100%; }
  }
  .packet { animation: travel linear infinite; }

  @keyframes node-pulse {
    0%, 100% { filter: drop-shadow(0 2px 8px rgba(37,99,235,0.12)); }
    50%       { filter: drop-shadow(0 4px 16px rgba(37,99,235,0.28)); }
  }
  .pulse-blue { animation: node-pulse 3s ease-in-out infinite; }

  @keyframes node-pulse-teal {
    0%, 100% { filter: drop-shadow(0 2px 8px rgba(13,148,136,0.12)); }
    50%       { filter: drop-shadow(0 4px 16px rgba(13,148,136,0.28)); }
  }
  .pulse-teal { animation: node-pulse-teal 3s ease-in-out infinite; }
</style>
</head>
<body>

<div class="header">
  <div class="badge">System Architecture</div>
  <div class="title">MedQA Multi-Agent Pipeline</div>
  <div class="subtitle">Live data flow between all system components</div>
</div>

  <marker id="a-teal"   markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0d9488"/></marker>

    <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0d9488" flood-opacity="0.22"/>
